<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A5BD9"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Rounded-square gradient background -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Soft glow ring (subtle depth) -->
  <circle cx="512" cy="512" r="310" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>
  <circle cx="512" cy="512" r="250" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5" stroke-dasharray="8 14"/>

  <!-- Compass rose: 4 long points (N/S/E/W) -->
  <g transform="translate(512 512)">
    <!-- Long needle: N (up) and S (down) -->
    <polygon
      points="0,-300 38,0 0,300 -38,0"
      fill="#FFFFFF"/>
    <!-- Long needle: E (right) and W (left) -->
    <polygon
      points="-300,0 0,-38 300,0 0,38"
      fill="#FFFFFF" fill-opacity="0.9"/>

    <!-- Diagonal short points (NE/SE/SW/NW) -->
    <g fill="#FFFFFF" fill-opacity="0.55">
      <polygon points="0,-180 22,-22 180,0 22,22 0,180 -22,22 -180,0 -22,-22"
               transform="rotate(45)"/>
    </g>

    <!-- Center hub -->
    <circle r="44" fill="#0F172A"/>
    <circle r="32" fill="#FFFFFF"/>
    <circle r="18" fill="#0F172A"/>

    <!-- N letter on the long top needle -->
    <text x="0" y="-330" text-anchor="middle"
          font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="68"
          fill="#FFFFFF" opacity="0.92">N</text>
  </g>

  <!-- Subtle pin marker on the upper-right edge of the orbit ring -->
  <g transform="translate(710 290)">
    <circle r="22" fill="#FFFFFF"/>
    <circle r="8" fill="#EC4899"/>
  </g>
</svg>
